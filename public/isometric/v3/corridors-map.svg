<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Corridor status map</title>
  <desc id="desc">Isometric corridor map showing one testnet live corridor and modeled routes.</desc>
  <style>
    :root{--bg:#F6F0ED;--ink:#1F4452;--slate:#326273;--teal:#5C9EAD;--gold:#D9A441;--surface:#FFFFFF;--surface2:#FBF7F5;--line:#E5DCD6}
    text{font-family:system-ui,sans-serif;fill:var(--ink)}
    .route{fill:none;stroke:var(--slate);stroke-width:3;stroke-linecap:round;opacity:.34}
    .live{stroke:var(--teal);opacity:1;stroke-dasharray:18 12;animation:dash 7s linear infinite}
    .badge{fill:var(--surface);stroke:var(--line);stroke-width:2}
    .badgeText{font-size:12px;font-weight:800;letter-spacing:.06em}
    @keyframes dash{to{stroke-dashoffset:-120}}
    @media (prefers-reduced-motion:reduce){.live{animation:none}}
  </style>
  <rect width="960" height="640" fill="var(--bg)"/>
  <path d="M104 398 480 190 856 398 480 604Z" fill="var(--surface2)" stroke="var(--line)" stroke-width="2"/>
  <path class="route live" d="M262 420 C384 316 548 292 698 356"/>
  <path class="route" d="M404 306 C500 242 594 230 694 262"/>
  <path class="route" d="M504 442 C612 402 706 410 790 466"/>
  <path class="route" d="M214 464 C336 500 468 486 574 428"/>
  <path class="route" d="M358 378 C456 348 546 354 638 388"/>
  <g fill="var(--surface)" stroke="var(--ink)" stroke-width="2">
    <path d="M220 398 260 376 300 398 260 420Z"/><path d="M458 280 498 258 538 280 498 302Z"/>
    <path d="M660 336 700 314 740 336 700 358Z"/><path d="M744 448 784 426 824 448 784 470Z"/>
    <path d="M556 416 596 394 636 416 596 438Z"/>
  </g>
  <g>
    <rect class="badge" x="618" y="280" width="168" height="34" rx="6"/><text class="badgeText" x="634" y="302">MY -> PH LIVE</text>
    <rect class="badge" x="500" y="222" width="150" height="34" rx="6"/><text class="badgeText" x="516" y="244">SG MODELED</text>
    <rect class="badge" x="688" y="486" width="166" height="34" rx="6"/><text class="badgeText" x="704" y="508">ID MODELED</text>
    <rect class="badge" x="188" y="506" width="166" height="34" rx="6"/><text class="badgeText" x="204" y="528">IN MODELED</text>
  </g>
</svg>
