<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Receivable lifecycle</title>
  <desc id="desc">Four isometric stations showing invoice accepted, early-pay offer, one-signature settle and anchored receipt.</desc>
  <style>
    :root{--bg:#F6F0ED;--ink:#1F4452;--slate:#326273;--teal:#5C9EAD;--gold:#D9A441;--surface:#FFFFFF;--surface2:#FBF7F5;--line:#E5DCD6}
    text{font-family:system-ui,sans-serif;fill:var(--ink)}
    .rail{fill:none;stroke:var(--slate);stroke-width:4;stroke-linecap:round;opacity:.42}
    .label{font-size:13px;font-weight:850;letter-spacing:.06em}
    .small{font-size:11px;font-weight:700;fill:var(--slate)}
  </style>
  <rect width="960" height="520" fill="var(--bg)"/>
  <path d="M82 286 480 74 878 286 480 498Z" fill="var(--surface2)" stroke="var(--line)" stroke-width="2"/>
  <path class="rail" d="M184 308 356 218 526 308 696 218"/>
  <g transform="translate(120 250)">
    <path d="M0 42 54 12 108 42 54 72Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
    <path d="M24 34h60v42H24z" fill="var(--surface2)" stroke="var(--ink)" stroke-width="2"/>
    <path d="M34 46h38M34 58h28" stroke="var(--teal)" stroke-width="3"/>
    <text class="label" x="-4" y="116">INVOICE ACCEPTED</text>
    <text class="small" x="16" y="136">buyer signed</text>
  </g>
  <g transform="translate(302 160)">
    <path d="M0 42 54 12 108 42 54 72Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
    <circle cx="54" cy="50" r="24" fill="var(--gold)" stroke="var(--ink)" stroke-width="2"/>
    <path d="M54 34v18l14 9" stroke="var(--ink)" stroke-width="3" fill="none"/>
    <text class="label" x="-8" y="116">EARLY-PAY OFFER</text>
    <text class="small" x="12" y="136">rate chosen</text>
  </g>
  <g transform="translate(484 250)">
    <path d="M0 42 54 12 108 42 54 72Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
    <path d="M30 52h48M58 30l22 22-22 22" stroke="var(--teal)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="-10" y="116">ONE-SIGNATURE SETTLE</text>
    <text class="small" x="8" y="136">funds atomic</text>
  </g>
  <g transform="translate(666 160)">
    <path d="M0 42 54 12 108 42 54 72Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
    <path d="M34 32h40v48H34z" fill="var(--surface2)" stroke="var(--ink)" stroke-width="2"/>
    <path d="M42 58h24M42 68h18" stroke="var(--slate)" stroke-width="3"/>
    <circle cx="76" cy="34" r="12" fill="var(--teal)" stroke="var(--ink)" stroke-width="2"/>
    <text class="label" x="-2" y="116">ANCHORED RECEIPT</text>
    <text class="small" x="12" y="136">proof retained</text>
  </g>
</svg>
